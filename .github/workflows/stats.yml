name: Generate Metrics

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: metrics.overview.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          base_indepth: yes
          config_timezone: Europe/Istanbul

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: "percentage, lines"
          plugin_languages_ignored: "html, css, scss, tex"
          config_timezone: Europe/Istanbul

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: metrics.calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Istanbul

      - name: Candidate topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: candidate.topics.svg
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          config_timezone: Europe/Istanbul

      - name: Candidate stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: candidate.stars.svg
          template: classic
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          config_timezone: Europe/Istanbul

      - name: Candidate notable
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          user: bozdemir
          filename: candidate.notable.svg
          template: classic
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes
          config_timezone: Europe/Istanbul
